<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concurso ATA — Enciclopédia de Estudos</title>
<style>
:root{
  --bg:#ffffff;
  --text:#2b2126;
  --muted:#7a5b66;
  --link:#c2185b;
  --link-visited:#8e1550;
  --border:#e8c3d4;
  --border-light:#f7e3ec;
  --panel:#fdf3f7;
  --accent:#d6336c;
  --accent-soft:#fce4ee;
  --good:#0e8f6f;
  --good-bg:#e5f7f1;
  --bad:#c2255c;
  --bad-bg:#fce8ee;
  --serif: Georgia, 'Times New Roman', Cambria, serif;
  --sans: 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif;
  --hl-yellow:#fff2a8;
  --hl-green:#c8f2c2;
  --hl-blue:#c6e2ff;
  --hl-pink:#ffd0e6;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6;}
a{color:var(--link);text-decoration:none;}
a:hover{text-decoration:underline;}
mark{padding:0 1px;border-radius:2px;cursor:pointer;}
mark.hl-yellow{background:var(--hl-yellow);}
mark.hl-green{background:var(--hl-green);}
mark.hl-blue{background:var(--hl-blue);}
mark.hl-pink{background:var(--hl-pink);}

/* ---------- Top bar ---------- */
.topbar{
  display:flex;align-items:center;gap:14px;
  background:var(--accent);color:#fff;padding:10px 18px;
  position:sticky;top:0;z-index:50;
  box-shadow:0 1px 4px rgba(0,0,0,.15);
}
.topbar .brand{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:.3px;color:#fff;display:flex;align-items:center;gap:8px;}
.topbar .brand small{font-family:var(--sans);font-size:11px;font-weight:400;opacity:.85;display:block;letter-spacing:.5px;}
.topbar .menu-toggle{display:none;background:none;border:1px solid rgba(255,255,255,.5);color:#fff;padding:6px 10px;border-radius:4px;cursor:pointer;font-size:16px;}
.search-wrap{flex:1;max-width:420px;position:relative;margin-left:auto;}
.search-wrap input{width:100%;padding:8px 12px;border-radius:20px;border:none;font-size:14px;outline:none;}
.search-results{position:absolute;top:38px;left:0;right:0;background:#fff;color:var(--text);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.18);max-height:340px;overflow:auto;display:none;z-index:60;}
.search-results a{display:block;padding:8px 12px;border-bottom:1px solid var(--border-light);color:var(--text);font-size:13.5px;}
.search-results a:hover{background:var(--panel);text-decoration:none;}
.search-results .sr-tag{color:var(--muted);font-size:11px;margin-left:6px;}
.pill-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.5);color:#fff;padding:7px 14px;border-radius:18px;font-size:13px;cursor:pointer;white-space:nowrap;}
.pill-btn:hover{background:rgba(255,255,255,.28);}

/* ---------- Layout ---------- */
.layout{display:flex;max-width:1400px;margin:0 auto;min-height:calc(100vh - 52px);}
.sidebar{
  width:280px;flex-shrink:0;border-right:1px solid var(--border-light);
  background:var(--panel);padding:18px 14px 60px;
  position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto;
}
.sidebar h4{font-family:var(--serif);font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:18px 0 6px 4px;}
.sidebar h4:first-child{margin-top:0;}
.subject-block{margin-bottom:2px;}
.subject-btn{
  width:100%;text-align:left;background:none;border:none;padding:8px 8px;font-size:14px;
  font-weight:600;color:var(--text);cursor:pointer;border-radius:4px;display:flex;justify-content:space-between;align-items:center;gap:6px;
  font-family:var(--serif);
}
.subject-btn:hover{background:var(--border-light);}
.subject-btn .car{font-size:10px;color:var(--muted);transition:transform .15s;}
.subject-btn.open .car{transform:rotate(90deg);}
.topic-list{display:none;padding-left:10px;border-left:2px solid var(--border-light);margin:2px 0 8px 12px;}
.topic-list.open{display:block;}
.topic-list a{display:block;font-size:13px;padding:5px 8px;color:var(--text);border-radius:3px;}
.topic-list a:hover{background:var(--border-light);text-decoration:none;}
.topic-list a.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.sidebar .qbank-link{display:block;font-size:13px;padding:6px 8px;margin-left:12px;color:var(--accent);font-weight:600;}
.sidebar .qbank-link:hover{text-decoration:underline;}
.sidebar-simulado{
  margin-top:14px;padding:12px;background:#fff;border:1px solid var(--border-light);border-radius:6px;
}
.sidebar-simulado a{font-weight:700;color:var(--accent);font-size:13.5px;}
.sidebar-simulado p{margin:4px 0 0;font-size:11.5px;color:var(--muted);}

.main{flex:1;min-width:0;padding:28px 40px 80px;}
.main.narrow{max-width:900px;}

/* ---------- Article ---------- */
.crumbs{font-size:12.5px;color:var(--muted);margin-bottom:10px;}
.crumbs a{color:var(--link);}
.article-title{font-family:var(--serif);font-size:32px;border-bottom:1px solid var(--border-light);padding-bottom:8px;margin:0 0 6px;}
.article-sub{color:var(--muted);font-size:13.5px;margin-bottom:22px;}
.article-content{max-width:820px;}
.article-content h3{font-family:var(--serif);font-size:19px;margin:26px 0 8px;color:var(--text);border-bottom:1px solid var(--border-light);padding-bottom:4px;}
.article-content h4{font-family:var(--serif);font-size:16px;margin:18px 0 6px;color:var(--accent);}
.article-content p{margin:0 0 14px;text-align:justify;}
.article-content ul{margin:0 0 14px;padding-left:22px;}
.article-content li{margin-bottom:6px;}
.article-content .tbl-label{display:inline-block;font-size:11.5px;color:#fff;background:var(--accent);padding:2px 8px;border-radius:3px;margin:10px 0 4px;font-weight:600;}
.article-content table{border-collapse:collapse;width:100%;margin:8px 0 20px;font-size:13.5px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.article-content table caption{caption-side:top;text-align:left;font-weight:700;color:var(--accent);margin-bottom:6px;font-family:var(--serif);}
.article-content th{background:var(--accent);color:#fff;text-align:left;padding:8px 12px;font-weight:600;border:1px solid var(--accent);}
.article-content td{padding:8px 12px;border:1px solid var(--border-light);vertical-align:top;}
.article-content tr:nth-child(even) td{background:var(--panel);}
.jump-box{
  background:var(--accent-soft);border:1px solid #e5c9c9;border-radius:8px;padding:14px 18px;margin:22px 0;
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
}
.jump-box .jb-text{font-size:14px;}
.jump-box .jb-text b{color:var(--accent);}
.btn{
  display:inline-block;background:var(--accent);color:#fff;padding:9px 16px;border-radius:6px;font-size:13.5px;font-weight:600;
  border:none;cursor:pointer;
}
.btn:hover{background:#6f2424;text-decoration:none;color:#fff;}
.btn.secondary{background:#fff;color:var(--accent);border:1.5px solid var(--accent);}
.btn.secondary:hover{background:var(--accent-soft);color:var(--accent);}

.hl-toolbar{
  position:absolute;display:none;background:#2b2b2b;border-radius:20px;padding:6px 8px;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:100;gap:5px;
}
.hl-toolbar button{width:22px;height:22px;border-radius:50%;border:2px solid #fff;cursor:pointer;padding:0;}
.hl-toolbar button.erase{background:#555;color:#fff;font-size:11px;width:auto;border-radius:12px;padding:0 8px;border:none;}
.hl-hint{font-size:12px;color:var(--muted);background:var(--panel);border:1px dashed var(--border);border-radius:6px;padding:8px 12px;margin-bottom:16px;}

/* ---------- Home ---------- */
.home-hero{
  background:linear-gradient(135deg, var(--accent-soft), #fff);
  border:1px solid var(--border-light);border-radius:12px;padding:34px 38px;margin-bottom:30px;
}
.home-hero h1{font-family:var(--serif);font-size:36px;margin:0 0 8px;}
.home-hero p{color:var(--muted);font-size:15px;max-width:640px;margin:0 0 18px;}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:10px;}
.home-card{
  border:1px solid var(--border-light);border-radius:10px;padding:16px 18px;background:#fff;transition:box-shadow .15s, transform .15s;
}
.home-card:hover{box-shadow:0 6px 18px rgba(0,0,0,.08);transform:translateY(-2px);text-decoration:none;}
.home-card h3{font-family:var(--serif);margin:0 0 4px;font-size:18px;color:var(--text);}
.home-card p{margin:0;font-size:12.5px;color:var(--muted);}
.home-card .count{display:inline-block;margin-top:8px;font-size:11.5px;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:10px;font-weight:600;}

/* ---------- Question bank ---------- */
.qb-header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;margin-bottom:6px;}
.qb-stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 26px;}
.stat-chip{background:var(--panel);border:1px solid var(--border-light);border-radius:8px;padding:8px 14px;font-size:12.5px;}
.stat-chip b{display:block;font-size:18px;font-family:var(--serif);}
.stat-chip.green b{color:var(--good);}
.stat-chip.red b{color:var(--bad);}

.qcard{border:1px solid var(--border-light);border-radius:10px;padding:20px 22px;margin-bottom:18px;background:#fff;}
.qcard .qnum{display:inline-block;background:var(--panel);border:1px solid var(--border-light);color:var(--muted);font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:12px;margin-bottom:10px;}
.qcard .qstem{font-size:15px;margin-bottom:14px;line-height:1.65;}
.qopt{
  display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1.5px solid var(--border-light);border-radius:8px;
  margin-bottom:8px;cursor:pointer;font-size:14px;background:#fff;transition:border-color .1s, background .1s;
}
.qopt:hover{border-color:var(--accent);}
.qopt .opt-letter{font-weight:700;color:var(--accent);flex-shrink:0;}
.qopt.correct{background:var(--good-bg);border-color:var(--good);}
.qopt.correct .opt-letter{color:var(--good);}
.qopt.wrong{background:var(--bad-bg);border-color:var(--bad);}
.qopt.wrong .opt-letter{color:var(--bad);}
.qopt.disabled{cursor:default;}
.qfeedback{display:none;margin-top:14px;padding:14px 16px;border-radius:8px;background:var(--panel);border-left:4px solid var(--accent);}
.qfeedback.show{display:block;}
.qfeedback .fb-row{margin-bottom:8px;font-size:13.5px;line-height:1.55;}
.qfeedback .fb-row:last-child{margin-bottom:0;}
.qfeedback b.lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:2px;}
.qfeedback .tip{background:#fff;border:1px dashed var(--border);border-radius:6px;padding:10px 12px;}
.qcard-footer{display:flex;justify-content:flex-end;margin-top:10px;}
.undo-btn{background:none;border:1px solid var(--border);color:var(--muted);font-size:12px;padding:5px 12px;border-radius:14px;cursor:pointer;display:none;}
.undo-btn.show{display:inline-block;}
.undo-btn:hover{border-color:var(--accent);color:var(--accent);}

.filterbar{display:flex;gap:8px;margin:16px 0 22px;flex-wrap:wrap;align-items:center;}
.filterbar button{background:#fff;border:1px solid var(--border);padding:6px 13px;border-radius:16px;font-size:12.5px;cursor:pointer;}
.filterbar button.active{background:var(--accent);color:#fff;border-color:var(--accent);}

/* Simulado config */
.sim-config{border:1px solid var(--border-light);border-radius:10px;padding:24px;background:var(--panel);max-width:600px;}
.sim-config label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;}
.sim-config select,.sim-config input[type=number]{padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:14px;width:100%;}
.chk-row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13.5px;}

footer.sitefoot{text-align:center;color:var(--muted);font-size:11.5px;padding:30px 10px;border-top:1px solid var(--border-light);margin-top:40px;}

@media (max-width: 880px){
  .sidebar{position:fixed;left:-300px;top:52px;height:calc(100vh - 52px);z-index:80;box-shadow:4px 0 20px rgba(0,0,0,.2);transition:left .2s;width:270px;}
  .sidebar.mobile-open{left:0;}
  .menu-toggle{display:inline-block;}
  .main{padding:20px 16px 60px;}
  .search-wrap{max-width:none;}
  .home-hero{padding:22px;}
  .article-title{font-size:26px;}
}
</style>
</head>
<body>

<div class="topbar">
  <button class="menu-toggle" id="menuToggle">☰</button>
  <a href="#/" class="brand">📘 Concurso ATA<small>Enciclopédia de Estudos</small></a>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Pesquisar matéria, tópico ou questão...">
    <div class="search-results" id="searchResults"></div>
  </div>
  <button class="pill-btn" onclick="location.hash='#/simulado'">🎯 Simulado</button>
</div>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main"></main>
</div>

<footer class="sitefoot">Concurso ATA — site de estudos gerado a partir da sua apostila e do caderno de 500 questões. Use o marca-texto para grifar trechos importantes.</footer>

<div class="hl-toolbar" id="hlToolbar">
  <button style="background:var(--hl-yellow)" data-c="hl-yellow" title="Amarelo"></button>
  <button style="background:var(--hl-green)" data-c="hl-green" title="Verde"></button>
  <button style="background:var(--hl-blue)" data-c="hl-blue" title="Azul"></button>
  <button style="background:var(--hl-pink)" data-c="hl-pink" title="Rosa"></button>
  <button class="erase" data-c="erase" title="Apagar grifo">✕</button>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
